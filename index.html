    function saveSpotModal() {
      const name = document.getElementById("modalSpotName").value.trim();
      if (!name) {
        alert("請輸入名稱！");
        return;
      }
      const type = document.getElementById("modalSpotType").value;
      const prefecture = document.getElementById("modalSpotPrefecture").value.trim();
      const station = document.getElementById("modalSpotStation").value.trim();
      const closedDay = document.getElementById("modalSpotClosedDay").value;
      const lat = parseFloat(document.getElementById("modalSpotLat").value) || 34.6;
      const lng = parseFloat(document.getElementById("modalSpotLng").value) || 133.5;
      const stayDuration = document.getElementById("modalSpotStayDuration").value.trim();
      const climbLevelText = document.getElementById("modalSpotClimbLevel").value.trim();
      const hours = document.getElementById("modalSpotHours").value.trim();
      const transit = document.getElementById("modalSpotTransit").value.trim();
      const notes = document.getElementById("modalSpotNotes").value.trim();
      const autoAssign = document.getElementById("modalAutoAssignCheckbox").checked;

      let targetSpotId = state.editingSpotId;

      if (state.editingSpotId) {
        const s = state.spots.find(item => item.id === state.editingSpotId);
        if (s) {
          s.name = name;
          s.type = type;
          s.prefecture = prefecture;
          s.nearestStation = station;
          s.closedDay = closedDay;
          s.lat = lat;
          s.lng = lng;
          s.stayDuration = stayDuration;
          s.climbLevelText = climbLevelText;
          s.openHours = hours;
          s.transitInfo = transit;
          s.notes = notes;
        }
      } else {
        targetSpotId = "custom_" + Date.now();
        state.spots.push({
          id: targetSpotId,
          name: name,
          type: type,
          prefecture: prefecture,
          lat: lat,
          lng: lng,
          nearestStation: station,
          stampLocation: type === "castle" ? "天守閣/管理處" : "",
          closedDay: closedDay,
          closedDayText: closedDay !== "None" ? `${closedDay}公休` : "無休",
          backupStamp: "",
          stayDuration: stayDuration || "1 小時",
          climbLevelText: climbLevelText,
          openHours: hours,
          transitInfo: transit,
          reservationUrl: "",
          notes: notes,
          checklists: {}
        });
      }

      // 如果勾選了「儲存時自動排入此推薦天數」
      if (autoAssign && currentModalRecommendation) {
        const targetDay = state.itinerary.find(d => d.dayNumber === currentModalRecommendation.dayNumber);
        if (targetDay) {
          // 先從其他天移除避免重複
          state.itinerary.forEach(d => {
            if (d.spotIds) d.spotIds = d.spotIds.filter(id => id !== targetSpotId);
          });
          if (!targetDay.spotIds) targetDay.spotIds = [];
          
          const sObj = state.spots.find(s => s.id === targetSpotId);
          if (isLodgingSpot(sObj)) {
            targetDay.spotIds.push(targetSpotId);
          } else if (currentModalRecommendation.bestInsertIndex >= targetDay.spotIds.length) {
            targetDay.spotIds.push(targetSpotId);
          } else {
            targetDay.spotIds.splice(currentModalRecommendation.bestInsertIndex, 0, targetSpotId);
          }

          // 強制確保溫泉住宿排在最末端
          targetDay.spotIds = sortDaySpotsLodgingAtEnd(targetDay.spotIds);
        }
      }

      saveState();
      closeSpotModal();
      renderMainPanel();
      renderMapElements();
      if (autoAssign && currentModalRecommendation) {
        alert(`已儲存「${name}」並自動規劃排入 Day ${currentModalRecommendation.dayNumber}！`);
      }
    }

    function generateShareUrl() {
      try {
        const payload = {
          itinerary: state.itinerary,
          deleted: state.deletedSpotIds || []
        };
        const jsonStr = JSON.stringify(payload);
        const base64 = btoa(unescape(encodeURIComponent(jsonStr)));
        const shareUrl = window.location.origin + window.location.pathname + '#plan=' + base64;
        
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(shareUrl).then(() => {
            alert("✅ 已成功複製「專屬行程分享網址」至剪貼簿！\\n\\n發給朋友打開，即可直接瀏覽您客製好的所有天數、車次、備忘與選定景點！");
          }).catch(() => {
            prompt("請手動按 Ctrl+C 複製以下專屬分享網址：", shareUrl);
          });
        } else {

    function exportJSON() {
      const exportData = {
        spots: state.spots,
        itinerary: state.itinerary,
        exportAt: new Date().toISOString()
      };
      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `Japan_100Castles_Trip_${new Date().toISOString().split('T')[0]}.json`;

    function importJSON(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const data = JSON.parse(evt.target.result);
          if (data.spots && data.itinerary) {
            state.spots = data.spots;
            state.itinerary = data.itinerary;
            saveState();
            renderMainPanel();
            renderMapElements();
            updateMapFilterDropdown();
            alert("成功匯入行程資料！");
          } else {
            alert("檔案格式不正確，缺少 spots 或 itinerary 欄位");
          }
        } catch(err) {
          alert("讀取失敗：" + err.message);
        }
      };
      reader.readAsText(file);
    }

    function exportMarkdown() {
      let md = `# 山陰山陽 100名城巡禮旅行計畫表\n\n`;
      md += `*產出時間：${new Date().toLocaleString()}*\n\n---\n\n`;

      state.itinerary.forEach(day => {
        const dow = getDayOfWeek(day.date);
        md += `## Day ${day.dayNumber}：${day.title} (${day.date || '未定'} ${dow ? dow.zh : ''})\n`;
        if (day.lodging) md += `- **住宿地點**：${day.lodging}\n`;
        if (day.baseStation) md += `- **出發/樞紐站**：${day.baseStation}\n`;
        if (day.notes) md += `- **備註事項**：${day.notes}\n`;
        md += `\n### 景點與車次順序：\n`;

        if (!day.spotIds || day.spotIds.length === 0) {
          md += `*(尚未排定景點)*\n\n`;
        } else {
          day.spotIds.forEach((sid, idx) => {
            const sp = state.spots.find(s => s.id === sid);
            if (!sp) return;
            const prevSp = idx > 0 ? state.spots.find(s => s.id === day.spotIds[idx - 1]) : null;
            const fromSt = prevSp ? prevSp.nearestStation : day.baseStation;
            md += `1. **${sp.name}** (${sp.prefecture})\n`;
            md += `   - 車站：${sp.nearestStation || '無'} (從 ${fromSt || '起點'} 轉乘)\n`;
            md += `   - 蓋章地點：${sp.stampLocation || '無'}\n`;
            md += `   - 開放時間：${sp.openHours || '見官網'} (公休：${sp.closedDayText || '無'})\n`;
            md += `   - 接駁交通：${sp.transitInfo || '無'}\n`;
            if (sp.reservationUrl) md += `   - 預約連結：${sp.reservationUrl}\n`;
            if (sp.notes) md += `   - 攻略筆記：${sp.notes}\n`;
            md += `\n`;
          });
        }
        md += `---\n\n`;
      });

      const blob = new Blob([md], { type: "text/markdown;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `Japan_100Castles_Itinerary_${new Date().toISOString().split('T')[0]}.md`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function resetToDefault() {
      if (!confirm("確定要重設為初始的 12 座名城推薦行程嗎？此操作將覆蓋現有修改。")) return;
      localStorage.removeItem(STORAGE_KEY_SPOTS);
      localStorage.removeItem(STORAGE_KEY_ITINERARY);
      localStorage.removeItem(STORAGE_KEY_DELETED_SPOTS);
      initState();
      renderMainPanel();
      renderMapElements();
      updateMapFilterDropdown();
      alert("已重設為預設名城資料！");
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // ==========================================
    // 啟動程式
    // ==========================================
    window.addEventListener("DOMContentLoaded", () => {
      initState();
      initMap();
      renderMainPanel();
    });
  </script>
</body>
</html>
