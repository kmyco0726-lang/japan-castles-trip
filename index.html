<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>山陰山陽 100名城巡禮規劃器</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    #map { height: 100%; min-height: 480px; z-index: 10; }
    .custom-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      border: 2px solid white;
      font-size: 14px;
      font-weight: bold;
      color: white;
    }
    .custom-marker.castle { background-color: #dc2626; }
    .custom-marker.lodging { background-color: #2563eb; }
    .custom-marker.custom { background-color: #059669; }
    .custom-marker.number-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      background: #111827;
      color: #facc15;
      font-size: 11px;
      border-radius: 9999px;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid white;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col h-screen overflow-hidden">

  <!-- 頂部導航列 -->
  <header class="bg-slate-900 text-white px-5 py-3 flex items-center justify-between shadow-md shrink-0">
    <div class="flex items-center gap-3">
      <span class="text-2xl">🏯</span>
      <div>
        <h1 class="text-lg font-bold tracking-wide flex items-center gap-2">
          山陰山陽 100名城巡禮路線規劃器
          <span class="text-xs bg-red-600 px-2 py-0.5 rounded font-mono font-normal">12名城+溫泉</span>
        </h1>
        <p class="text-xs text-slate-400">含休館日智能檢核・Yahoo乘換案內直連・住宿筆記・離線儲存</p>
      </div>
    </div>
    <div class="flex items-center gap-2 text-sm">
      <button onclick="generateShareUrl()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-3 py-1.5 rounded flex items-center gap-1.5 transition shadow-sm text-xs">
        🔗 複製分享連結
      </button>
      <button onclick="exportMarkdown()" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded flex items-center gap-1.5 transition">
        📄 匯出手冊 (Markdown)
      </button>
      <button onclick="exportJSON()" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded flex items-center gap-1.5 transition">
        📥 備份 JSON
      </button>
      <label class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded flex items-center gap-1.5 cursor-pointer transition">
        📤 讀取 JSON
        <input type="file" id="importInput" accept=".json" class="hidden" onchange="importJSON(event)">
      </label>
      <button onclick="resetToDefault()" class="bg-rose-900/60 hover:bg-rose-800 text-rose-200 px-3 py-1.5 rounded transition">
        🔄 重設
      </button>
    </div>
  </header>

  <!-- 主工作區：左側排程/車次/筆記，右側互動地圖 -->
  <div class="flex flex-1 overflow-hidden">
    
    <!-- 左側面板 (Tabs: 行程規劃 / 景點清單 / 快速查車次) -->
    <div class="w-full md:w-7/12 lg:w-1/2 flex flex-col border-r border-slate-200 bg-white z-20 shadow-lg overflow-hidden">
      <!-- 標籤切換 -->
      <div class="flex border-b border-slate-200 bg-slate-100 text-sm font-medium">
        <button id="tabBtnItinerary" onclick="switchTab('itinerary')" class="flex-1 py-3 px-4 text-center border-b-2 border-red-600 font-bold text-red-600 bg-white">
          📅 每日行程與車次 (<span id="totalDaysBadge">7</span> 天)
        </button>
        <button id="tabBtnSpots" onclick="switchTab('spots')" class="flex-1 py-3 px-4 text-center text-slate-600 hover:text-slate-900">
          📍 全部景點庫 (<span id="totalSpotsBadge">13</span> 處)
        </button>
        <button id="tabBtnTransit" onclick="switchTab('transit')" class="flex-1 py-3 px-3 text-center text-slate-600 hover:text-slate-900 text-xs sm:text-sm">
          🚅 車次速查
        </button>
        <button id="tabBtnFlights" onclick="switchTab('flights')" class="flex-1 py-3 px-3 text-center text-slate-600 hover:text-slate-900 text-xs sm:text-sm font-semibold flex items-center justify-center gap-1">
          <span>✈️</span> 機票比價
        </button>
      </div>

      <!-- 面板內容區域 (可捲動) -->
      <div class="flex-1 overflow-y-auto p-4 space-y-4" id="mainPanelContent">
        <!-- 內容由 JavaScript 動態渲染 -->
      </div>
    </div>

    <!-- 右側地圖面板 -->
    <div class="w-full md:w-5/12 lg:w-1/2 flex flex-col relative">
      <!-- 地圖過濾工具列 -->
      <div class="absolute top-3 right-3 z-[1000] bg-white/95 backdrop-blur shadow-md rounded-lg p-2 flex items-center gap-2 text-xs">
        <span class="font-bold text-slate-700">地圖顯示：</span>
        <select id="mapFilterSelect" onchange="onMapFilterChange()" class="border border-slate-300 rounded px-2 py-1 text-slate-700 bg-white font-medium">
          <option value="all">🗺️ 全部天數與景點</option>
          <!-- 動態填入 Day 1, Day 2 等 -->
        </select>
        <button onclick="fitMapBounds()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2 py-1 rounded border border-slate-300">
          🎯 置中縮放
        </button>
      </div>

      <!-- 地圖容器 -->
      <div id="map"></div>

      <!-- 地圖圖例 -->
      <div class="bg-white border-t border-slate-200 px-4 py-2 flex items-center justify-between text-xs text-slate-600 z-10 shrink-0">
        <div class="flex items-center gap-4">
          <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-red-600 inline-block"></span> 100名城 (12座)</span>
          <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-blue-600 inline-block"></span> 溫泉 / 住宿點</span>
          <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-emerald-600 inline-block"></span> 自訂地點</span>
        </div>
        <span class="text-slate-400">點擊標記查看蓋章地點、營業時間與轉乘案內</span>
      </div>
    </div>

  </div>

  <!-- 彈窗：新增自訂景點/住宿 Modal (含自動規劃排程) -->
  <div id="spotModal" class="fixed inset-0 bg-black/50 z-[2000] hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-2xl max-w-lg w-full p-5 space-y-3.5 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-slate-900 text-base" id="spotModalTitle">新增景點 / 住宿</h3>
        <button onclick="closeSpotModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
      </div>

      <!-- 快速套用山陰山陽熱門點位 -->
      <div class="bg-slate-50 border border-slate-200 rounded-lg p-2.5 text-xs">
        <div class="text-[11px] font-bold text-slate-700 mb-1.5 flex items-center gap-1">
          <span>⚡ 快速套用沿途熱門點位 (自動填寫經緯度、車站與轉乘攻略)：</span>
        </div>
        <div class="flex flex-wrap gap-1.5" id="presetButtonsContainer">
          <!-- JS 動態填入預設按鈕 -->
        </div>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="font-medium text-slate-700">名稱 *</label>
            <button type="button" onclick="autoGeocodeFromName()" id="btnAutoGeocode" class="text-[11px] text-blue-600 hover:text-blue-800 font-bold flex items-center gap-0.5">
              🔍 線上自動抓取座標與車站
            </button>
          </div>
          <input type="text" id="modalSpotName" oninput="onModalCoordsOrNameChange()" class="w-full border rounded p-2 text-sm" placeholder="例如：出雲大社 / 嚴島神社 / 足立美術館">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-medium text-slate-700 mb-1">類型</label>
            <select id="modalSpotType" class="w-full border rounded p-2 bg-white">
              <option value="castle">🏯 名城 / 史蹟</option>
              <option value="lodging">🏨 住宿 / 飯店 / 溫泉</option>
              <option value="custom">📍 一般景點 / 美食</option>
            </select>
          </div>
          <div>
            <label class="block font-medium text-slate-700 mb-1">所在縣市</label>
            <input type="text" id="modalSpotPrefecture" class="w-full border rounded p-2" placeholder="岡山 / 鳥取 / 島根...">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-medium text-slate-700 mb-1">最靠近之車站 (供查車次)</label>
            <input type="text" id="modalSpotStation" class="w-full border rounded p-2" placeholder="例如：出雲市駅 / 岡山駅">
          </div>
          <div>
            <label class="block font-medium text-slate-700 mb-1">公休日</label>
            <select id="modalSpotClosedDay" onchange="onModalCoordsOrNameChange()" class="w-full border rounded p-2 bg-white">
              <option value="None">無公休</option>
              <option value="Monday">週一 (Monday)</option>
              <option value="Tuesday">週二 (Tuesday)</option>
              <option value="Wednesday">週三 (Wednesday)</option>
              <option value="Thursday">週四 (Thursday)</option>
              <option value="Friday">週五 (Friday)</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-medium text-slate-700 mb-1">緯度 (Latitude)</label>
            <input type="number" step="0.0001" id="modalSpotLat" oninput="onModalCoordsOrNameChange()" class="w-full border rounded p-2 font-mono" placeholder="例如：34.595">
          </div>
          <div>
            <label class="block font-medium text-slate-700 mb-1">經度 (Longitude)</label>
            <input type="number" step="0.0001" id="modalSpotLng" oninput="onModalCoordsOrNameChange()" class="w-full border rounded p-2 font-mono" placeholder="例如：133.771">
          </div>
        </div>

        <!-- 🤖 自動規劃排程即時運算區 -->
        <div id="modalPlanRecommendationBox" class="bg-blue-50/80 border border-blue-200 rounded-lg p-3 space-y-1.5 hidden">
          <div class="font-bold text-blue-900 flex items-center justify-between text-xs">
            <span class="flex items-center gap-1">🤖 系統自動規劃建議：</span>
            <span id="modalRecDayBadge" class="bg-blue-600 text-white text-[11px] px-2 py-0.5 rounded font-bold font-mono">推薦 Day 3</span>
          </div>
          <p id="modalRecReasonText" class="text-[11px] text-blue-800 leading-relaxed"></p>
          <div class="pt-1.5 border-t border-blue-200/80 flex items-center justify-between">
            <label class="flex items-center gap-1.5 text-slate-800 font-bold cursor-pointer text-xs">
              <input type="checkbox" id="modalAutoAssignCheckbox" checked class="rounded text-blue-600">
              <span>儲存時自動排入此最佳天數 (<span id="modalRecInsertPos" class="text-blue-700">第 2 順位</span>)</span>
            </label>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-medium text-slate-700 mb-1">⏱️ 建議預留時間</label>
            <input type="text" id="modalSpotStayDuration" class="w-full border rounded p-2" placeholder="基本 1 小時 / 爬山 1.5~2 小時">
          </div>
          <div>
            <label class="block font-medium text-slate-700 mb-1">⛰️ 地形 / 登山步道難度</label>
            <input type="text" id="modalSpotClimbLevel" class="w-full border rounded p-2" placeholder="平山城 / 陡峭山城需爬坡">
          </div>
        </div>
        <div>
          <label class="block font-medium text-slate-700 mb-1">開放/打卡時間 或 Check-in</label>
          <input type="text" id="modalSpotHours" class="w-full border rounded p-2" placeholder="09:00 - 17:00 或 15:00入住">
        </div>
        <div>
          <label class="block font-medium text-slate-700 mb-1">交通方式與轉乘說明</label>
          <textarea id="modalSpotTransit" rows="2" class="w-full border rounded p-2" placeholder="例如：從車站步行10分鐘..."></textarea>
        </div>
        <div>
          <label class="block font-medium text-slate-700 mb-1">備註 / 事項 / 預約網址</label>
          <textarea id="modalSpotNotes" rows="2" class="w-full border rounded p-2" placeholder="注意事項、票價、電話等"></textarea>
        </div>
      </div>
      <div class="flex justify-end gap-2 pt-2 border-t">
        <button onclick="closeSpotModal()" class="px-4 py-2 border rounded text-xs text-slate-600 hover:bg-slate-100">取消</button>
        <button onclick="saveSpotModal()" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded text-xs font-bold shadow-sm">儲存地點</button>
      </div>
    </div>
  </div>

  
  <!-- 彈窗：為特定天數挑選加入景點 Modal -->
  <div id="dayAddSpotModal" class="fixed inset-0 bg-black/50 z-[2000] hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-2xl max-w-xl w-full p-5 space-y-3 max-h-[90vh] flex flex-col">
      <div class="flex justify-between items-center border-b pb-2 shrink-0">
        <div>
          <h3 class="font-bold text-slate-900 text-base flex items-center gap-2">
            <span>➕ 選擇加入景點至</span>
            <span id="dayAddSpotModalBadge" class="text-xs bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded font-bold font-mono">Day 1</span>
          </h3>
          <p class="text-xs text-slate-500">點擊「加入」或「移出」即時連動當日行程與地圖路線</p>
        </div>
        <button onclick="closeDayAddSpotModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
      </div>

      <!-- 搜尋與分類 -->
      <div class="flex items-center gap-2 shrink-0">
        <input type="text" id="dayAddSpotSearchInput" oninput="renderDayAddSpotModalList()" placeholder="搜尋景點名稱、縣市或關鍵字..." class="flex-1 border border-slate-300 rounded-lg px-3 py-1.5 text-xs bg-slate-50 focus:bg-white outline-none">
        <select id="dayAddSpotCategoryFilter" onchange="renderDayAddSpotModalList()" class="border border-slate-300 rounded-lg px-2 py-1.5 text-xs bg-white text-slate-700">
          <option value="all">全部分類</option>
          <option value="shrine">⛩️ 靈驗神社</option>
          <option value="scenic">🏞️ 沿線絕景</option>
          <option value="gourmet">🥩 頂級和牛</option>
          <option value="anime">⚡ 寶可夢/文藝</option>
          <option value="castle">🏯 100名城</option>
          <option value="lodging">♨️ 溫泉住宿</option>
        </select>
      </div>

      <!-- 景點列表 -->
      <div id="dayAddSpotModalList" class="flex-1 overflow-y-auto space-y-2 pr-1 text-xs">
        <!-- 動態渲染景點 -->
      </div>

      <div class="flex justify-end pt-2 border-t shrink-0">
        <button onclick="closeDayAddSpotModal()" class="px-4 py-1.5 bg-slate-800 text-white rounded text-xs font-bold hover:bg-slate-900 transition">完成</button>
      </div>
    </div>
  </div>

  <!-- 彈窗：智慧規劃排程分析 Modal (針對任一景點評估最佳落點) -->
  <div id="smartPlanModal" class="fixed inset-0 bg-black/50 z-[2000] hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-2xl max-w-lg w-full p-5 space-y-3.5 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-2">
        <div>
          <h3 class="font-bold text-slate-900 text-base flex items-center gap-2">
            <span>✨ 自動排程規劃分析</span>
            <span id="smartPlanSpotBadge" class="text-xs bg-red-100 text-red-700 px-2 py-0.5 rounded font-bold"></span>
          </h3>
          <p class="text-xs text-slate-500">演算法依據【地理距離繞路成本】、【休館日衝突】與【當日行程負荷】全面排序</p>
        </div>
        <button onclick="closeSmartPlanModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
      </div>

      <div id="smartPlanContent" class="space-y-2.5 text-xs">
        <!-- 動態填入分析評估清單 -->
      </div>

      <div class="flex justify-end pt-2 border-t">
        <button onclick="closeSmartPlanModal()" class="px-4 py-2 border rounded text-xs text-slate-600 hover:bg-slate-100">關閉</button>
      </div>
    </div>
  </div>

  <!-- 載入原始景點資料庫 -->
  <script src="spots_data.js"></script>

  <!-- 應用程式主邏輯 -->
  <script>
    // ==========================================
    // 狀態管理與 LocalStorage 初始化
    // ==========================================
    const STORAGE_KEY_SPOTS = "jp_castles_spots_v1";
    const STORAGE_KEY_ITINERARY = "jp_castles_itinerary_v1";
    const STORAGE_KEY_ITINERARY_VER = "jp_castles_itinerary_ver";
    const STORAGE_KEY_DELETED_SPOTS = "jp_castles_deleted_spots_v1";
    const CURRENT_ITINERARY_VER = "2027_01_13_26_TRANSIT_CLEAN_V32";

    let state = {
      spots: [],
      itinerary: [],
      deletedSpotIds: [],
      activeTab: "itinerary",
      selectedDayFilter: "all",
      editingSpotId: null
    };


    // ==========================================
    // 預定義各天景點之真實地理最佳順序表 (Canonical Geographic Routing Sequence)
    // 告別錯置：嚴格遵循地理行車鐵路先後順序，且所有溫泉/住宿點一律排在最後面！
    // ==========================================
    const CANONICAL_SPOT_ORDER = {
      1: ['okayama_airport', 'chiyagyu_bisai', 'chiyagyu_kuya', 'okayama_aeon', 'okayama_hotel'],
      2: ['kinojo', 'tsuyama', 'yunogo_onsen'],
      3: ['tottori', 'tottori_takumi', 'tottori_sakyu', 'kaike_onsen'],
      4: ['gassan_toda', 'adachi_museum', 'matsue', 'matsue_horikawa', 'matsue_lodging'],
      5: ['izumo_taisha', 'yaegaki_jinja', 'tamatsukuri_yu_jinja', 'tamatsukuri_onsen'],
      6: ['taikodani_inari', 'tsuwano', 'hagi_lodging'],
      7: ['motonosumi_jinja', 'hagi', 'shin_yamaguchi_lodging'],
      8: ['iwakuni', 'itsukushima_jinja', 'hiroshima_lodging_d8'],
      9: ['hiroshima', 'hiroshima_gokoku_jinja', 'pokemon_center_hiroshima', 'atomic_bomb_dome', 'hiroshima_peace_museum', 'hiroshima_jinseki', 'hiroshima_atago', 'hiroshima_lodging_d9'],
      10: ['yoshida_koriyama', 'fukuyama', 'tomonoura_onsen'],
      11: ['kibitsuhiko_jinja', 'kibitsu_jinja', 'okayama_hotel_d11'],
      12: ['bitchu_matsuyama', 'okayama_airport']
    };

    // 自動排序單日景點 (依地理順路動線與住宿點排最後原則)
    function sortDaySpots(dayNumber, spotIds) {
      if (!spotIds || !Array.isArray(spotIds)) return [];
      const orderList = CANONICAL_SPOT_ORDER[dayNumber] || [];

      // Day 1 特別處理：機場 ➔ 住宿Check-in ➔ 和牛 ➔ 逛街 ➔ 住宿
      if (dayNumber === 1) {
        const d1Desired = ['okayama_airport', 'chiyagyu_bisai', 'okayama_aeon', 'okayama_hotel'];
        return d1Desired.filter(id => spotIds.includes(id));
      }

      // 其他天數：優先按權威地理順路表 (orderList) 排序！
      // 若景點已明列在 orderList 中 (如 Day 3 開頭湯郷溫泉、結尾皆生溫泉)，100% 遵照權威順序
      return [...spotIds].sort((a, b) => {
        const idxA = orderList.indexOf(a);
        const idxB = orderList.indexOf(b);
        if (idxA !== -1 && idxB !== -1) return idxA - idxB;
        if (idxA !== -1) return -1;
        if (idxB !== -1) return 1;

        // 不在權威清單中的自訂點，若為住宿則排在最後
        const spA = state.spots.find(s => s.id === a);
        const spB = state.spots.find(s => s.id === b);
        const aIsLodging = isLodgingSpot(spA);
        const bIsLodging = isLodgingSpot(spB);
        if (aIsLodging && !bIsLodging) return 1;
        if (!aIsLodging && bIsLodging) return -1;
        return 0;
      });
    }

    // 自動排序特定天之景點
    function autoSortDay(dayNumber) {
      const day = state.itinerary.find(d => d.dayNumber === dayNumber);
      if (day && day.spotIds && day.spotIds.length > 0) {
        day.spotIds = sortDaySpots(day.dayNumber, day.spotIds);
        saveState();
        renderApp();
      }

    // 自動排序全行程所有天數之景點
    function sortAllDaysSpots(silent = false) {
      state.itinerary.forEach(day => {
        if (day.spotIds && day.spotIds.length > 0) {
          day.spotIds = sortDaySpots(day.dayNumber, day.spotIds);
        }
      });
      saveState();
      renderApp();
      if (!silent) {
        alert("✨ 已自動將所有天數之景點依真實地理動線與住宿最佳順序排序完成！");
      }
    }

    // 判定是否為溫泉或住宿地點
    function isLodgingSpot(spot) {
      if (!spot) return false;
      if (spot.type === "lodging") return true;
      const n = (spot.name || "").toLowerCase();
      return n.includes("溫泉") || n.includes("温泉") || n.includes("onsen") || 
             n.includes("旅館") || n.includes("飯店") || n.includes("酒店") || n.includes("hotel") || n.includes("宿");
    }

    // 強制規則：溫泉與住宿點一律排在當天最後面
    
    // 渲染當日行前備忘與注意事項的結構化段落檢視
    function renderNotesParagraphs(notes) {
      if (!notes || !notes.trim()) return '';
      const lines = notes.split('\n').map(l => l.trim()).filter(Boolean);
      if (lines.length === 0) return '';

      const paragraphsHtml = lines.map(line => {
        let icon = '📌';
        if (line.includes('交通') || line.includes('巴士') || line.includes('車次') || line.includes('鐵路') || line.includes('航班') || line.includes('利木津')) icon = '🚌';
        else if (line.includes('城') || line.includes('天守') || line.includes('登山') || line.includes('步道') || line.includes('攻城') || line.includes('石垣')) icon = '🏯';
        else if (line.includes('溫泉') || line.includes('夜宿') || line.includes('旅館') || line.includes('飯店') || line.includes('Check-in')) icon = '♨️';
        else if (line.includes('行李') || line.includes('寄放')) icon = '🧳';
        else if (line.includes('美食') || line.includes('逛街') || line.includes('採買') || line.includes('商圈')) icon = '🛍️';
        else if (line.includes('注意') || line.includes('警示') || line.includes('預約') || line.includes('休館')) icon = '⚠️';

        return `
          <div class="flex items-start gap-2 text-xs text-slate-700 leading-relaxed bg-white/95 p-2 rounded-lg border border-slate-200 shadow-2xs">
            <span class="text-sm shrink-0 leading-tight">${icon}</span>
            <div class="flex-1 whitespace-pre-wrap">${escapeHtml(line)}</div>
          </div>
        `;
      }).join('');

      return `
        <div class="mt-2 space-y-1.5">
          <div class="text-[11px] font-bold text-slate-600 flex items-center justify-between">
            <span class="flex items-center gap-1"><span>📖</span> 備忘段落清晰檢視：</span>
            <span class="text-[10px] text-slate-400 font-normal">已自動排版分段</span>
          </div>
          <div class="space-y-1.5">
            ${paragraphsHtml}
          </div>
        </div>
      `;
    }

    function sortDaySpotsLodgingAtEnd(spotIds) {
      if (!spotIds || spotIds.length <= 1) return spotIds || [];
      const normalSpots = [];
      const lodgingSpots = [];
      spotIds.forEach(id => {
        const sp = state.spots.find(s => s.id === id);
        if (isLodgingSpot(sp)) {
          lodgingSpots.push(id);
        } else {
          normalSpots.push(id);
        }
      });
      return [...normalSpots, ...lodgingSpots];
    }

    function initState() {
      // 支援網址分享還原：若網址含 #plan= 參數，自動優先載入朋友或自己分享的客製行程
      if (typeof window !== 'undefined' && window.location && window.location.hash && window.location.hash.startsWith('#plan=')) {
        try {
          const rawBase64 = window.location.hash.replace('#plan=', '');
          const decodedJson = decodeURIComponent(escape(atob(rawBase64)));
          const sharedData = JSON.parse(decodedJson);
          if (sharedData.itinerary && Array.isArray(sharedData.itinerary)) {
            state.itinerary = sharedData.itinerary;
          }
          if (sharedData.deleted && Array.isArray(sharedData.deleted)) {
            state.deletedSpotIds = sharedData.deleted;
          }
        } catch (err) {
          console.warn('無法解析分享網址中的行程參數:', err);
        }
      }

      // 讀取 LocalStorage，嚴格保護使用者已自訂的行程內容
      const savedSpots = localStorage.getItem(STORAGE_KEY_SPOTS);
      const savedItinerary = localStorage.getItem(STORAGE_KEY_ITINERARY);
      const savedVer = localStorage.getItem(STORAGE_KEY_ITINERARY_VER);
      
      // V12 修復：清空先前可能誤刪的 deleted 列表，讓出雲大社與所有名勝完整重現在庫！
      if (savedVer !== CURRENT_ITINERARY_VER) {
        state.deletedSpotIds = [];
        localStorage.removeItem(STORAGE_KEY_DELETED_SPOTS);
        localStorage.setItem(STORAGE_KEY_ITINERARY_VER, CURRENT_ITINERARY_VER);
      } else {
        const savedDeleted = localStorage.getItem(STORAGE_KEY_DELETED_SPOTS);
        state.deletedSpotIds = savedDeleted ? JSON.parse(savedDeleted) : [];
      }

      // 行程保護原則：若使用者先前已有儲存排程，絕對以使用者的自訂行程為準！
      if (savedVer !== CURRENT_ITINERARY_VER || !savedItinerary) {
        // 版本升級至 14 天舒緩版 (1/13 ~ 1/26)：全面重載全新 14 天優雅步調行程
        state.itinerary = JSON.parse(JSON.stringify(DEFAULT_ITINERARY));
      } else {
        try {
          state.itinerary = JSON.parse(savedItinerary);
        } catch (e) {
          state.itinerary = JSON.parse(JSON.stringify(DEFAULT_ITINERARY));
        }
      }

      // 景點庫合流：確保 DEFAULT_SPOTS 內全部 40 處景點（包含出雲大社、吉備津彥神社等）全數在庫
      state.spots = savedSpots ? JSON.parse(savedSpots) : [];
      DEFAULT_SPOTS.forEach(ds => {
        if (state.deletedSpotIds && state.deletedSpotIds.includes(ds.id)) return;
        const existing = state.spots.find(s => s.id === ds.id);
        if (!existing) {
          state.spots.push(JSON.parse(JSON.stringify(ds)));
        }
      });

      // 若某些 spot 缺失預設屬性，補齊
      state.spots.forEach(s => {
        if (!s.checklists) s.checklists = {};
      });

      // 確保 Day 1 嚴格符合指定：「機場 ➔ 和牛 ➔ 逛街 ➔ 住宿，不要有其他行程」
      const day1 = state.itinerary.find(d => d.dayNumber === 1);
      if (day1) {
        day1.title = "Day 1：抵達岡山・機場 ➔ 住宿 ➔ 和牛 ➔ 逛街";
        day1.spotIds = ['okayama_airport', 'chiyagyu_bisai', 'okayama_aeon', 'okayama_hotel'];
        day1.notes = "• 【機場抵達】：搭乘台灣虎航下午抵達岡山桃太郎機場 (OKJ)。出關後於 2 號乘車處搭乘利木津巴士約 30 分鐘直達岡山站西口 (單程 780 円，可刷 IC 卡)。\n• 【住宿 Check-in】：進駐岡山站前飯店 (格蘭比亞 / 大和Roynet / 三井花園) 辦理入住手續並放下大件行李。\n• 【和牛晚餐 (岡山千屋牛)】：前往岡山格蘭比亞 2F 直結之「鉄板焼 備彩」，零距離品嚐日本最古老血統和牛——岡山千屋牛頂級鐵板燒。\n• 【商圈漫遊 & 逛街】：餐後漫步西日本最大級「AEON Mall Okayama」(營業至 21:00，350間店鋪) 逛街採買藥妝物資，無其他多餘奔波行程，早點休息為明日 12 名城巡禮儲備體力！";
      }

      // 確保徹底排除未指定之倉敷景點，並依使用者規則「若無景點自動將後面天數往前移動」
      state.spots = state.spots.filter(s => s.id !== 'kurashiki_bikan' && s.id !== 'onomichi_senkoji');
      state.itinerary.forEach(d => {
        if (d.spotIds) d.spotIds = d.spotIds.filter(id => id !== 'kurashiki_bikan' && id !== 'onomichi_senkoji');
      });
      // 往前遞補空天數並依序重編天數
      const emptyDayFound = state.itinerary.some(d => !d.spotIds || d.spotIds.length === 0);
      if (emptyDayFound) {
        state.itinerary = state.itinerary.filter(d => d.spotIds && d.spotIds.length > 0);
        state.itinerary.forEach((d, idx) => {
          d.dayNumber = idx + 1;
        });
      }

      // 清理任何歷史殘留跨天重複 (如舊版遺留之 Day 4 出雲大社、Day 3 湯郷溫泉)
      const d3 = state.itinerary.find(d => d.dayNumber === 3);

      if (d2 && d2.spotIds) {
        d2.spotIds = d2.spotIds.filter(id => id !== 'kibitsuhiko_jinja' && id !== 'kibitsu_jinja');
      }

      // 啟動時自動排序所有天數
      state.itinerary.forEach(d => {
        if (d.spotIds && d.spotIds.length > 0) {
          d.spotIds = sortDaySpots(d.dayNumber, d.spotIds);
        }
      });

      saveState();
    }

    // 取得兩點之間的真實鐵路/公路地理軌跡經緯度陣列 (告別生硬直線)
    function getRealisticTransitTrack(fromSpot, toSpot, dayNumber) {
      if (!fromSpot || !toSpot) return [];
      const fromId = fromSpot.id;
      const toId = toSpot.id;

      // 1. 精確 key 配對
      const directKey = `${fromId}_to_${toId}`;
      if (REALISTIC_TRACK_CORRIDORS[directKey]) {
        return REALISTIC_TRACK_CORRIDORS[directKey];
      }

      // 反向 key 配對
      const reverseKey = `${toId}_to_${fromId}`;
      if (REALISTIC_TRACK_CORRIDORS[reverseKey]) {
        return [...REALISTIC_TRACK_CORRIDORS[reverseKey]].reverse();
      }

      // 2. 依關鍵起訖點智能走廊匹配
      if (toId === 'okayama_airport' || fromId === 'okayama_airport') {
        return REALISTIC_TRACK_CORRIDORS["okayama_airport_to_okayama_station"];
      }
      if (toId === 'kibitsuhiko_jinja') {
        return REALISTIC_TRACK_CORRIDORS["okayama_to_kibitsuhiko_jinja"];
      }
      if (toId === 'kibitsu_jinja') {
        return REALISTIC_TRACK_CORRIDORS["kibitsuhiko_jinja_to_kibitsu_jinja"];
      }
      if (toId === 'kinojo') {
        return REALISTIC_TRACK_CORRIDORS["okayama_to_kinojo"];
      }
      if (toId === 'tsuyama') {
        return REALISTIC_TRACK_CORRIDORS["kinojo_to_tsuyama"];
      }
      if (toId === 'yunogo_onsen') {
        return REALISTIC_TRACK_CORRIDORS["tsuyama_to_yunogo_onsen"];
      }
      if (toId === 'tottori' || toId === 'tottori_takumi') {
        return REALISTIC_TRACK_CORRIDORS["yunogo_onsen_to_tottori"];
      }
      if (toId === 'kaike_onsen' || toId === 'tottori_tsubomi') {
        return REALISTIC_TRACK_CORRIDORS["tottori_to_kaike_onsen"];
      }
      if (toId === 'gassan_toda' || toId === 'adachi_museum') {
        return REALISTIC_TRACK_CORRIDORS["kaike_onsen_to_gassan_toda"];
      }
      if (toId === 'matsue' || toId === 'matsue_horikawa') {
        return REALISTIC_TRACK_CORRIDORS["gassan_toda_to_matsue"];
      }
      if (toId === 'izumo_taisha') {
        return REALISTIC_TRACK_CORRIDORS["matsue_to_izumo_taisha"];
      }
      if (fromId === 'izumo_taisha' && toId === 'tamatsukuri_onsen') {
        return REALISTIC_TRACK_CORRIDORS["izumo_taisha_to_tamatsukuri_onsen"];
      }
      if (toId === 'tsuwano' || toId === 'taikodani_inari') {
        return REALISTIC_TRACK_CORRIDORS["tamatsukuri_onsen_to_tsuwano"];
      }
      if (toId === 'hagi') {
        return REALISTIC_TRACK_CORRIDORS["tsuwano_to_hagi"];
      }
      if (fromId === 'hagi' || toId === 'shin_yamaguchi') {
        return REALISTIC_TRACK_CORRIDORS["hagi_to_shin_yamaguchi"];
      }
      if (toId === 'iwakuni') {

      }
      if (toId === 'hiroshima') {

        return REALISTIC_TRACK_CORRIDORS["hiroshima_to_pokemon_center_hiroshima"];
      }
      if (toId === 'hiroshima_peace_museum') {

      }
      if (toId === 'bitchu_matsuyama') {
        return REALISTIC_TRACK_CORRIDORS["tomonoura_onsen_to_bitchu_matsuyama"];
      }

      // 3. 通用平滑弧線內插 (針對自訂延伸點，沿地理走向產生自然平滑弧線，拒絕生硬直線)
      return generateCurvedTrack(fromSpot, toSpot);
    }

    // 針對非預定義點位產生自然微弧線 (配合地形走勢)
    function generateCurvedTrack(p1, p2) {
      const lat1 = p1.lat, lng1 = p1.lng;
      const lat2 = p2.lat, lng2 = p2.lng;
      const midLat = (lat1 + lat2) / 2;
      const midLng = (lng1 + lng2) / 2;
      // 微偏向海岸或平原軸向
      const offsetLat = (lng2 - lng1) * 0.08;
      const offsetLng = -(lat2 - lat1) * 0.08;
      return [
        [lat1, lng1],
        [midLat + offsetLat, midLng + offsetLng],
        [lat2, lng2]
      ];
    }

    // 取得每日完整出發/途經/抵達動線點位清單 (含跨日住宿站點接駁)
    function getDayTransitSequence(day) {
      if (!day) return [];
      const spotObjects = (day.spotIds || [])
        .map(id => state.spots.find(s => s.id === id))
        .filter(Boolean);

      const dNum = day.dayNumber;
      const okayamaStationSpot = { id: 'okayama_station', name: '岡山駅 (市區飯店)', lat: 34.6663, lng: 133.9185, type: 'lodging' };
      const shinYamaguchiSpot = { id: 'shin_yamaguchi_station', name: '新山口駅 (新幹線飯店)', lat: 34.0934, lng: 131.3986, type: 'lodging' };
      const hiroshimaCenterSpot = { id: 'hiroshima_center', name: '廣島市區飯店', lat: 34.3962, lng: 132.4562, type: 'lodging' };

      const result = [];

        const aeonSpot = state.spots.find(s => s.id === 'okayama_aeon');

        result.push(hotelSpot);

          result.push(tomonouraSpot);
        }
        result.push(okayamaStationSpot);
        spotObjects.forEach(sp => result.push(sp));
      } else if (dNum === 12) {

          result.push(airportSpot);
        }
      } else {
        spotObjects.forEach(sp => result.push(sp));
      }

      return result;

      let hasPoints = false;

      // 如果選定特定 Day，繪製該日之真實鐵路/公路動線與編號標記
      if (filter !== "all") {
        const dayNum = parseInt(filter, 10);
        const day = state.itinerary.find(d => d.dayNumber === dayNum);
        if (day) {
          const dayColor = DAY_COLORS[(day.dayNumber - 1) % DAY_COLORS.length];

          // 1. 標記各景點 Marker
          (day.spotIds || []).forEach((id, idx) => {
            const spot = state.spots.find(s => s.id === id);
            if (spot && spot.lat && spot.lng) {
              const pos = [spot.lat, spot.lng];
              bounds.extend(pos);
              hasPoints = true;

              const marker = createCustomMarker(spot, idx + 1, dayColor);
              marker.addTo(markersLayer);
            }
          });

          // 2. 繪製順著鐵路/公路的真實蜿蜒軌跡 (含每日起訖車站/利木津巴士接駁)
          const transitSeq = getDayTransitSequence(day);
          for (let i = 0; i < transitSeq.length - 1; i++) {
            const sp1 = transitSeq[i];
            const sp2 = transitSeq[i + 1];
            if (sp1 && sp2 && sp1.lat && sp2.lat) {
              const trackPoints = getRealisticTransitTrack(sp1, sp2, day.dayNumber);
              trackPoints.forEach(p => {
                bounds.extend(p);
                hasPoints = true;
              });

              // 外層主題色光暈底線 (平滑圓角)
              const outerGlow = L.polyline(trackPoints, {
                color: dayColor,
                weight: 6,
                opacity: 0.45,
                lineCap: 'round',
                lineJoin: 'round'
              }).addTo(linesLayer);

              // 內層真實鐵路/巴士軌道主線 (雙色鐵路質感斑馬線)
              const innerTrack = L.polyline(trackPoints, {
                color: '#1e293b',
                weight: 2.5,
                opacity: 0.9,
                dashArray: '7, 5',
                lineCap: 'butt'
              }).addTo(linesLayer);

              const info = getTransitDetails(sp1, sp2, day.dayNumber);
              const tooltipContent = `
                <div class="text-xs p-1">
                  <div class="font-bold text-slate-900 flex items-center gap-1">
                    <span>🚅</span> <strong>Day ${day.dayNumber} 移動動線</strong>
                  </div>
                  <div class="text-[11px] text-slate-700 mt-0.5">
                    <strong>${escapeHtml(sp1.name)}</strong> ➔ <strong>${escapeHtml(sp2.name)}</strong>
                  </div>
                  <div class="text-[10px] text-blue-700 mt-0.5 font-medium">
                    ${escapeHtml(info.name)} (${escapeHtml(info.time)})
                  </div>
                  <div class="text-[9px] ${info.passCovered ? 'text-emerald-700' : 'text-amber-700'} font-bold">
                    ${info.passCovered ? '✅ JR Pass 包含' : '⚠️ JR Pass 不含需自費'}
                  </div>
                </div>
              `;
              innerTrack.bindTooltip(tooltipContent, { sticky: true, direction: 'top' });
              outerGlow.bindTooltip(tooltipContent, { sticky: true, direction: 'top' });
            }
          }
        }
      } else {
        // 全部天數模式：顯示所有景點，並依每日路線畫上真實軌跡
        state.spots.forEach(spot => {
          if (spot.lat && spot.lng) {
            const pos = [spot.lat, spot.lng];
            bounds.extend(pos);
            hasPoints = true;

            const marker = createCustomMarker(spot, null, null);
            marker.addTo(markersLayer);
          }
        });

        // 依天數分別畫出真實的鐵路與公路蜿蜒折線
        state.itinerary.forEach((day, dIdx) => {
          const dayColor = DAY_COLORS[dIdx % DAY_COLORS.length];
          const transitSeq = getDayTransitSequence(day);

          for (let i = 0; i < transitSeq.length - 1; i++) {
            const sp1 = transitSeq[i];
            const sp2 = transitSeq[i + 1];
            if (sp1 && sp2 && sp1.lat && sp2.lat) {
              const trackPoints = getRealisticTransitTrack(sp1, sp2, day.dayNumber);
              trackPoints.forEach(p => bounds.extend(p));

              // 外層主題色光暈
              L.polyline(trackPoints, {
                color: dayColor,
                weight: 5,
                opacity: 0.4,
                lineCap: 'round',
                lineJoin: 'round'
              }).addTo(linesLayer);

              // 內層鐵道主線
              const trackLine = L.polyline(trackPoints, {
                color: '#334155',
                weight: 2,
                opacity: 0.85,
                dashArray: '6, 5',
                lineCap: 'butt'
              }).addTo(linesLayer);

              const info = getTransitDetails(sp1, sp2, day.dayNumber);
              trackLine.bindTooltip(`<b>Day ${day.dayNumber}</b>: ${escapeHtml(sp1.name)} ➔ ${escapeHtml(sp2.name)}<br><span style="color:#2563eb;">${escapeHtml(info.name)}</span>`, { sticky: true });
            }
          }
        });
      }

      if (hasPoints && !state._userPanned) {
        map.fitBounds(bounds, { padding: [40, 40] });
      }
    }

    function createCustomMarker(spot, seqNumber, highlightColor) {
      let iconHtml = "";
      let bgClass = "castle";
      let iconEmoji = "🏯";

      if (spot.type === "lodging") {
        bgClass = "lodging";
        iconEmoji = "♨️";
      } else if (spot.type === "custom") {
        bgClass = "custom";
        iconEmoji = "📍";
      }

      const styleOverride = highlightColor ? `background-color: ${highlightColor};` : "";
      const badgeHtml = seqNumber ? `<span class="custom-marker number-badge">${seqNumber}</span>` : "";

      const html = `
        <div class="custom-marker ${bgClass}" style="width: 32px; height: 32px; ${styleOverride}">
          <span>${iconEmoji}</span>
          ${badgeHtml}
        </div>
      `;

      const customIcon = L.divIcon({
        html: html,
        className: '',
        iconSize: [32, 32],
        iconAnchor: [16, 16],
        popupAnchor: [0, -18]
      });

      const marker = L.marker([spot.lat, spot.lng], { icon: customIcon });

      // 檢查休館日
      const closedDayWarning = spot.closedDay !== "None" 
        ? `<div class="mt-1 text-xs bg-amber-50 text-amber-800 p-1.5 rounded border border-amber-200">

           </a>`

      // 車次直連按鈕
      const transitBtn = spot.nearestStation 
        ? `<a href="https://transit.yahoo.co.jp/search/result?from=${encodeURIComponent('岡山')}&to=${encodeURIComponent(spot.nearestStation)}" target="_blank" class="inline-block mt-1 text-xs bg-blue-600 hover:bg-blue-700 text-white px-2 py-0.5 rounded mr-1">
            🚅 岡山發車查
           </a>
           <a href="https://www.google.com/maps/dir/?api=1&destination=${spot.lat},${spot.lng}&travelmode=transit" target="_blank" class="inline-block mt-1 text-xs bg-slate-700 hover:bg-slate-800 text-white px-2 py-0.5 rounded">
            🗺️ Google轉乘
           </a>`
        : "";

      const popupHtml = `
        <div class="p-1 min-w-[240px]">
          <div class="flex items-center justify-between border-b pb-1">
            <h4 class="font-bold text-sm text-slate-900">${escapeHtml(spot.name)}</h4>
            <span class="text-[11px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded">${escapeHtml(spot.prefecture || '')}</span>
          </div>
          <div class="text-xs text-slate-600 mt-2 space-y-1">
            <div><strong>🚉 最近車站：</strong>${escapeHtml(spot.nearestStation || '無')}</div>
            ${spot.stayDuration ? `<div><strong>⏱️ 建議停留：</strong><span class="font-bold text-slate-900">${escapeHtml(spot.stayDuration)}</span> ${spot.climbLevelText ? `<span class="text-amber-800 text-[11px]">(${escapeHtml(spot.climbLevelText)})</span>` : ''}</div>` : ''}
            <div><strong>⏰ 開放/蓋章：</strong>${escapeHtml(spot.openHours || '見官網')}</div>
            <div><strong>📮 蓋章處：</strong>${escapeHtml(spot.stampLocation || '無')}</div>
            ${spot.backupStamp ? `<div><strong>🔄 備用章處：</strong>${escapeHtml(spot.backupStamp)}</div>` : ''}
            <div><strong>🚌 接駁交通：</strong>${escapeHtml(spot.transitInfo || '')}</div>
            ${closedDayWarning}
            ${reserveBtn}
            <div class="pt-2 border-t mt-2 flex flex-wrap gap-1">
              ${transitBtn}

      marker.bindPopup(popupHtml);

    function fitMapBounds() {

        if (s.lat && s.lng) {
          bounds.extend([s.lat, s.lng]);

      });
      if (has && map) {

    function focusSpotOnMap(spotId) {
      const spot = state.spots.find(s => s.id === spotId);
      if (spot && spot.lat && spot.lng && map) {
        map.setView([spot.lat, spot.lng], 14, { animate: true });

    // ==========================================
    // 星期計算與休館日衝突警告
    // ==========================================
    const DAY_OF_WEEK_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    const DAY_OF_WEEK_ZH = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];

    function getDayOfWeek(dateStr) {
      if (!dateStr) return null;
      const d = new Date(dateStr + "T00:00:00");
      if (isNaN(d.getTime())) return null;
      return {
        en: DAY_OF_WEEK_NAMES[d.getDay()],
        zh: DAY_OF_WEEK_ZH[d.getDay()]
      };
    }

    // 檢查某景點在某天是否衝堂公休
    function checkSpotClosedConflict(spot, dateStr) {
      if (!spot || !spot.closedDay || spot.closedDay === "None" || !dateStr) return null;
      const dow = getDayOfWeek(dateStr);
      if (!dow) return null;
      if (spot.closedDay.toLowerCase() === dow.en.toLowerCase()) {
        return {
          dayZh: dow.zh,
          spotName: spot.name,
          closedText: spot.closedDayText || `${dow.zh}休館`,
          backup: spot.backupStamp
        };
      }
      return null;
    }

    function renderMainPanel() {

      } else if (state.activeTab === "spots") {

    // ==========================================
    // 推薦景點加選與移出管理模組 (Recommended Spots Manager)
    // ==========================================
    let recManagerOpen = true;
    let recManagerCategory = 'all';
    let currentAddModalDay = null;

    function getSpotCategory(s) {
      if (!s) return 'custom';
      if (s.type === 'jinja' || s.climbLevel === 'shrine' || s.name.includes('神社') || s.name.includes('大社')) return 'shrine';
      if (s.type === 'castle') return 'castle';
      if (s.type === 'lodging') return 'lodging';
      if (s.climbLevel === 'scenic' || s.id.includes('sakyu') || s.id.includes('bikan') || s.id.includes('senkoji') || s.id.includes('museum') || s.id.includes('mizuki') || s.id.includes('horikawa')) return 'scenic';
      if (s.climbLevel === 'gourmet' || s.id.includes('chiyagyu') || s.id.includes('takumi') || s.id.includes('tsubomi') || s.id.includes('jinseki') || s.id.includes('atago')) return 'gourmet';
      if (s.climbLevel === 'anime' || s.climbLevel === 'museum' || s.id.includes('pokemon') || s.id.includes('peace') || s.id.includes('atomic')) return 'anime';
      return 'custom';
    }

    function getCategoryBadge(cat) {
      switch(cat) {
        case 'shrine': return '<span class="text-[10px] bg-rose-100 text-rose-800 font-bold px-1.5 py-0.5 rounded border border-rose-200">⛩️ 靈驗神社</span>';
        case 'scenic': return '<span class="text-[10px] bg-emerald-100 text-emerald-800 font-bold px-1.5 py-0.5 rounded border border-emerald-200">🏞️ 沿線絕景</span>';
        case 'gourmet': return '<span class="text-[10px] bg-amber-100 text-amber-900 font-bold px-1.5 py-0.5 rounded border border-amber-200">🥩 頂級和牛</span>';
        case 'anime': return '<span class="text-[10px] bg-purple-100 text-purple-800 font-bold px-1.5 py-0.5 rounded border border-purple-200">⚡ 寶可夢/文藝</span>';
        case 'castle': return '<span class="text-[10px] bg-red-100 text-red-800 font-bold px-1.5 py-0.5 rounded border border-red-200">🏯 100名城</span>';
        case 'lodging': return '<span class="text-[10px] bg-indigo-100 text-indigo-800 font-bold px-1.5 py-0.5 rounded border border-indigo-200">♨️ 溫泉住宿</span>';
        default: return '<span class="text-[10px] bg-slate-100 text-slate-700 font-bold px-1.5 py-0.5 rounded">📍 特色點位</span>';

      recManagerOpen = !recManagerOpen;
      renderMainPanel();

    function setRecManagerCategory(cat) {
      recManagerCategory = cat;
      renderMainPanel();
    }

    function addSpotToDay(spotId, dayNumber, insertIndex = -1) {
      const targetDay = state.itinerary.find(d => d.dayNumber === dayNumber);
      const spot = state.spots.find(s => s.id === spotId);
      if (!targetDay || !spot) return;

      // 先從其他天移除避免重複
      state.itinerary.forEach(d => {
        if (d.spotIds) d.spotIds = d.spotIds.filter(id => id !== spotId);
      });

      if (!targetDay.spotIds) targetDay.spotIds = [];
      if (isLodgingSpot(spot) || insertIndex === -1 || insertIndex >= targetDay.spotIds.length) {
        targetDay.spotIds.push(spotId);
      } else {
        targetDay.spotIds.splice(insertIndex, 0, spotId);
      }
      targetDay.spotIds = sortDaySpotsLodgingAtEnd(targetDay.spotIds);
      saveState();
      renderMainPanel();
      renderMapElements();
    }

    function addSpotToBestDay(spotId) {
      const spot = state.spots.find(s => s.id === spotId);
      if (!spot) return;
      const recs = analyzeBestDaysForSpot(spot);
      if (recs && recs.length > 0) {
        const best = recs[0];
        addSpotToDay(spotId, best.dayNumber, best.bestInsertIndex);
      } else {
        addSpotToDay(spotId, 1);
      }
    }

    function removeSpotFromItinerary(spotId) {
      let changed = false;
      state.itinerary.forEach(d => {
        if (d.spotIds && d.spotIds.includes(spotId)) {
          d.spotIds = d.spotIds.filter(id => id !== spotId);
          changed = true;
        }
      });
      // 依使用者規則：「若沒有景點就將後面資料往前移動」！
      const hasEmptyDays = state.itinerary.some(d => !d.spotIds || d.spotIds.length === 0);
      if (hasEmptyDays) {
        state.itinerary = state.itinerary.filter(d => d.spotIds && d.spotIds.length > 0);
        state.itinerary.forEach((d, idx) => {
          d.dayNumber = idx + 1;
        });
        changed = true;
      }
      if (changed) {
        saveState();
        renderMainPanel();
        renderMapElements();
        updateMapFilterDropdown();
      }
    }


    // 清理未加入行程之推薦選項（和牛餐廳無論是否排入皆完整保留；吉備津彥神社保留）
    

    // 徹底從景點資料庫與行程中刪除景點 (支援復原)
    function deleteSpotPermanently(spotId) {
      const spot = state.spots.find(s => s.id === spotId);
      if (!spot) return;

      const confirmMsg = `確定要將「${spot.name}」從景點資料庫中刪除嗎？\n\n• 刪除後將不再出現在推薦加選庫與行程中\n• 若需找回，可隨時點擊「🔄 恢復預設景點庫」一鍵復原。`;
      if (!confirm(confirmMsg)) return;

      // 1. 從所有天數中移出
      state.itinerary.forEach(d => {
        if (d.spotIds) {
          d.spotIds = d.spotIds.filter(id => id !== spotId);
        }
      });

      // 2. 從 state.spots 中移除
      state.spots = state.spots.filter(s => s.id !== spotId);

      // 3. 記錄至 deletedSpotIds 避免重新整理時合流補回
      if (!state.deletedSpotIds) state.deletedSpotIds = [];
      if (!state.deletedSpotIds.includes(spotId)) {
        state.deletedSpotIds.push(spotId);
      }

      saveState();
      renderMainPanel();
      renderMapElements();
      updateMapFilterDropdown();

      // 若加選彈窗開啟中，同步刷新
      if (currentAddModalDay) {
        renderDayAddSpotModalList();
      }
    }

    // 一鍵恢復所有被刪除的預設景點
    function restoreDefaultSpots() {
      const deletedCount = (state.deletedSpotIds || []).length;
      if (deletedCount === 0) {
        alert("目前沒有任何被刪除的預設景點，所有 39 處名勝皆完整在庫！");
        return;
      }

      if (!confirm(`確定要恢復已刪除的 ${deletedCount} 個預設景點嗎？\n（您現有已排入的行程天數與順序不會受任何影響）`)) return;

      state.deletedSpotIds = [];
      localStorage.removeItem(STORAGE_KEY_DELETED_SPOTS);

      // 將 DEFAULT_SPOTS 重新合流補齊進 state.spots
      DEFAULT_SPOTS.forEach(ds => {
        const existing = state.spots.find(s => s.id === ds.id);
        if (!existing) {
          state.spots.push(JSON.parse(JSON.stringify(ds)));
        }
      });

      saveState();
      renderMainPanel();
      renderMapElements();
      updateMapFilterDropdown();

      if (currentAddModalDay) {
        renderDayAddSpotModalList();
      }
      alert("已成功恢復所有預設景點！");
    }

               <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>

    // ==========================================
    // 為特定天數加入景點彈窗 (Day Add Spot Modal)
    // ==========================================
    function openAddSpotModalForDay(dayNumber) {
      currentAddModalDay = dayNumber;
      const modal = document.getElementById("dayAddSpotModal");
      const badge = document.getElementById("dayAddSpotModalBadge");
      const targetDay = state.itinerary.find(d => d.dayNumber === dayNumber);
      if (badge && targetDay) {
        badge.innerText = `Day ${dayNumber}：${targetDay.title.split('：')[1] || targetDay.title}`;
      }
      document.getElementById("dayAddSpotSearchInput").value = "";
      document.getElementById("dayAddSpotCategoryFilter").value = "all";
      renderDayAddSpotModalList();
      modal.classList.remove("hidden");
    }

    function closeDayAddSpotModal() {
      document.getElementById("dayAddSpotModal").classList.add("hidden");
      currentAddModalDay = null;
    }

    function renderDayAddSpotModalList() {
      const container = document.getElementById("dayAddSpotModalList");
      if (!container || !currentAddModalDay) return;
      const search = (document.getElementById("dayAddSpotSearchInput").value || "").trim().toLowerCase();
      const catFilter = document.getElementById("dayAddSpotCategoryFilter").value;
      const targetDay = state.itinerary.find(d => d.dayNumber === currentAddModalDay);
      if (!targetDay) return;

      const filtered = state.spots.filter(s => {
        if (s.id === 'okayama_airport') return false;
        const cat = getSpotCategory(s);
        if (catFilter !== 'all' && cat !== catFilter) return false;
        if (search) {
          const matchName = (s.name || "").toLowerCase().includes(search);
          const matchPref = (s.prefecture || "").toLowerCase().includes(search);
          const matchNotes = (s.notes || "").toLowerCase().includes(search);
          if (!matchName && !matchPref && !matchNotes) return false;
        }
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="p-6 text-center text-slate-400">無相符的景點</div>`;
        return;
      }

      const html = filtered.map(spot => {
        const inThisDay = (targetDay.spotIds || []).includes(spot.id);
        const assignedDay = state.itinerary.find(d => (d.spotIds || []).includes(spot.id));
        const cat = getSpotCategory(spot);
        const catBadge = getCategoryBadge(cat);

        let actionBtn = "";
        let borderCls = "border-slate-200 bg-white";

        if (inThisDay) {
          borderCls = "border-emerald-300 bg-emerald-50/50";
          actionBtn = `
            <span class="text-emerald-700 font-bold text-xs flex items-center gap-1 mr-1">✅ 已在本日</span>
            <button onclick="removeSpotFromDay(${currentAddModalDay}, ${targetDay.spotIds.indexOf(spot.id)}); renderDayAddSpotModalList();" class="bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 px-2 py-1 rounded text-xs font-bold transition">
              移出
            </button>
          `;
        } else if (assignedDay) {
          actionBtn = `
            <span class="text-slate-500 text-[11px] mr-1">在 Day ${assignedDay.dayNumber}</span>
            <button onclick="addSpotToDay('${spot.id}', ${currentAddModalDay}); renderDayAddSpotModalList();" class="bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 px-2 py-1 rounded text-xs font-bold transition">
              移入本日
            </button>
          `;
        } else {
          actionBtn = `
            <button onclick="addSpotToDay('${spot.id}', ${currentAddModalDay}); renderDayAddSpotModalList();" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1 rounded text-xs font-bold transition flex items-center gap-1 shadow-2xs">
              <span>➕</span> 加入本日
            </button>
            <button onclick="deleteSpotPermanently('${spot.id}')" title="不考慮此景點，從資料庫刪除" class="bg-slate-100 hover:bg-rose-100 text-slate-400 hover:text-rose-600 p-1 rounded text-xs transition">
              🗑️
            </button>
          `;
        }

        return `
          <div class="p-2.5 rounded-lg border ${borderCls} flex items-center justify-between gap-2 transition">
            <div>
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="font-bold text-slate-900">${escapeHtml(spot.name)}</span>
                ${catBadge}
                <span class="text-[10px] bg-slate-100 text-slate-600 px-1 rounded">${escapeHtml(spot.prefecture || '')}</span>
              </div>
              <div class="text-[11px] text-slate-500 mt-0.5 line-clamp-1">
                ${escapeHtml(spot.notes || spot.climbLevelText || '')}
              </div>
            </div>
            <div class="flex items-center gap-1 shrink-0">
              ${actionBtn}
            </div>
          </div>
        `;
      }).join('');

      container.innerHTML = html;
    }

    // ------------------------------------------
    // Tab 1: 行程規劃 (Itinerary Tab)
    // ------------------------------------------
    
    // 景點分類搜尋與過濾狀態
    let spotCategoryFilter = 'all';
    let spotSearchKeyword = '';
    let spotScheduledStatusFilter = 'all';
    let itineraryCategoryFilter = 'all';

    function getSpotScheduledDays(spotId) {
      const days = [];
      if (!state || !state.itinerary) return days;
      const spot = (state.spots || []).find(s => s.id === spotId);
      const isLodging = spot && isLodgingSpot(spot);

      state.itinerary.forEach(d => {
        if (d.spotIds && d.spotIds.includes(spotId)) {
          // 依使用者嚴格要求：住宿溫泉搜尋「只出現當晚，隔天早上的不出現在搜尋裡」！
          if (isLodging) {
            // 判定是否為「當晚入住日」：
            // 1. 該 spot 是該天行程最後一個點位 (即晚上入住)
            // 2. 或者該天的 lodging 欄位與此住宿點相符
            const idx = d.spotIds.indexOf(spotId);
            const isAtNightCheckin = (idx === d.spotIds.length - 1);
            const cleanLodgingName = (d.lodging || "").split('(')[0].trim();
            const cleanSpotName = (spot.name || "").split('(')[0].trim();
            const isMatchingDayLodging = cleanLodgingName.includes(cleanSpotName) || cleanSpotName.includes(cleanLodgingName);
            
            // 只有當晚夜宿才計入搜尋結果，隔天早晨出發點嚴格排除！
            if (isAtNightCheckin || isMatchingDayLodging) {
              days.push(d);
            }
          } else {
            days.push(d);
          }
        }
      });
      return days;
    }

    function getCategoryName(cat) {
      switch(cat) {
        case 'shrine': return '⛩️ 神社/大社';
        case 'castle': return '🏯 100名城';
        case 'lodging': return '♨️ 溫泉住宿';
        case 'gourmet': return '🥩 頂級和牛';
        case 'scenic': return '🏞️ 經典名勝';
        case 'anime': return '⚡ 寶可夢/文藝';
        default: return '📍 特色景點';
      }
    }

    function setItineraryCategoryFilter(cat) {
      itineraryCategoryFilter = cat;
      const container = document.getElementById("mainPanelContent");
      if (container) renderItineraryTab(container);
    }

    function setSpotCategoryFilter(cat) {
      spotCategoryFilter = cat;
      const container = document.getElementById("mainPanelContent");
      if (container) renderSpotsTab(container);
    }

    function setSpotScheduledStatusFilter(status) {
      spotScheduledStatusFilter = status;
      const container = document.getElementById("mainPanelContent");
      if (container) renderSpotsTab(container);
    }

    function onSpotSearchInput(val) {
      spotSearchKeyword = val;
      const cardsContainer = document.getElementById("spotsCardsContainer");
      if (cardsContainer) {
        renderSpotsCardsOnly(cardsContainer);
      } else {
        const container = document.getElementById("mainPanelContent");
        if (container) renderSpotsTab(container);
      }
    }

    function clearSpotSearch() {
      spotSearchKeyword = '';
      const input = document.getElementById("spotsSearchInput");
      if (input) input.value = '';
      const container = document.getElementById("mainPanelContent");
      if (container) renderSpotsTab(container);
    }

    function jumpToDayFromSpots(dayNumber, spotId) {
      switchTab('itinerary');
      setTimeout(() => {
        scrollToDay(dayNumber);
        if (spotId) focusSpotOnMap(spotId);
      }, 120);
    }

    
    function renderScheduledCategorySummary(cat) {
      const catSpots = state.spots.filter(s => getSpotCategory(s) === cat);
      const scheduledList = [];
      catSpots.forEach(s => {
        const days = getSpotScheduledDays(s.id);
        if (days.length > 0) {
          days.forEach(d => {
            scheduledList.push({ spot: s, day: d });
          });
        }
      });

      // 依天數先後排序
      scheduledList.sort((a, b) => a.day.dayNumber - b.day.dayNumber);

      const catName = getCategoryName(cat);
      const isShrine = cat === 'shrine';
      const isLodging = cat === 'lodging';

      let borderClass = 'border-indigo-300 bg-indigo-50/90 text-indigo-950';
      let badgeBg = 'bg-indigo-600 text-white';
      if (isShrine) {
        borderClass = 'border-rose-300 bg-rose-50/90 text-rose-950';
        badgeBg = 'bg-rose-600 text-white';
      } else if (isLodging) {
        borderClass = 'border-blue-300 bg-blue-50/90 text-blue-950';
        badgeBg = 'bg-blue-600 text-white';
      }

      const subtitleText = isLodging 
        ? '🌙 溫泉住宿只呈現「當晚入住日」，隔天清晨啟程不列入搜尋'
        : '點擊「👉 直達該天」按鈕立即滾動切換至該天行程與地圖定位：';

      return `
        <div class="p-3.5 rounded-xl border-2 ${borderClass} space-y-2.5 shadow-2xs">
          <div class="flex items-center justify-between flex-wrap gap-1 border-b ${isShrine ? 'border-rose-200' : isLodging ? 'border-blue-200' : 'border-indigo-200'} pb-2">
            <div class="flex items-center gap-2">
              <span class="text-xl">${isShrine ? '⛩️' : isLodging ? '♨️' : '✨'}</span>
              <div>
                <h4 class="font-black text-xs sm:text-sm flex items-center gap-1.5">
                  <span>已排入行程的【${catName}】清單 (共 ${scheduledList.length} 處落點)</span>
                  <span class="text-[10px] ${isShrine ? 'bg-rose-200 text-rose-900' : isLodging ? 'bg-blue-200 text-blue-900' : 'bg-indigo-200 text-indigo-900'} px-2 py-0.5 rounded-full font-bold">
                    ${isLodging ? '當晚入住唯一定錨' : '清晰標示第幾天'}
                  </span>
                </h4>
                <p class="text-[11px] ${isShrine ? 'text-rose-800' : isLodging ? 'text-blue-800' : 'text-indigo-800'} mt-0.5">
                  ${subtitleText}
                </p>
              </div>
            </div>
            <button onclick="switchTab('spots'); setSpotCategoryFilter('${cat}');" class="text-xs ${badgeBg} hover:opacity-90 font-bold px-2.5 py-1 rounded-lg transition shadow-2xs">
              📍 景點庫看全部 (${catSpots.length}) ➔
            </button>
          </div>

          ${scheduledList.length === 0 ? `
            <div class="text-xs text-slate-500 py-1">目前行程中尚無排入此分類之景點。</div>
          ` : `
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
              ${scheduledList.map(item => `
                <div class="bg-white p-2.5 rounded-lg border border-slate-200 shadow-2xs flex items-center justify-between gap-2 hover:border-blue-400 transition">
                  <div class="min-w-0">
                    <div class="font-black text-slate-900 text-xs flex items-center gap-1">
                      <span>${escapeHtml(item.spot.name)}</span>
                    </div>
                    <div class="text-[10px] text-slate-500 mt-0.5 flex items-center gap-1">
                      <span class="bg-slate-100 px-1 py-0.2 rounded text-slate-600">${escapeHtml(item.spot.prefecture || '')}</span>
                      <span>${isLodging ? '🌙 當晚夜宿放鬆' : escapeHtml(item.spot.stayDuration ? '⏱️ ' + item.spot.stayDuration : '')}</span>
                    </div>
                  </div>
                  <div class="flex items-center gap-1.5 shrink-0">
                    <span class="text-xs font-black font-mono px-2 py-1 rounded-md ${isLodging ? 'bg-blue-100 text-blue-800 border border-blue-200' : 'bg-red-100 text-red-800 border border-red-200'}">
                      ${isLodging ? '當晚 Day ' + item.day.dayNumber : '第 ' + item.day.dayNumber + ' 天'}
                    </span>
                    <button onclick="scrollToDay(${item.day.dayNumber}); focusSpotOnMap('${item.spot.id}');" class="text-xs bg-slate-800 hover:bg-slate-900 text-white font-bold px-2 py-1 rounded transition shadow-2xs flex items-center gap-0.5">
                      👉 直達
                    </button>
                  </div>
                </div>
              `).join('')}
            </div>
          `}
        </div>
      `;
    }

    function renderItineraryTab(container) {
      // 依使用者需求：已關閉最上方「一鍵自動排入最佳天數」提示，改由使用者完全自主掌控加入與刪除
      const assignedIds = new Set();
      state.itinerary.forEach(d => (d.spotIds || []).forEach(id => assignedIds.add(id)));

      // 頂部天數速跳膠囊導航列 (快速直達特定天，帶有當天專屬色票)
      let dayNavPills = "";
      if (state.itinerary.length > 0) {
        dayNavPills = `
          <div class="sticky -top-4 z-10 bg-white/95 backdrop-blur-md pt-1 pb-2 border-b border-slate-200/90 -mx-4 px-4 mb-4 shadow-2xs">
            <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-0.5">
              <button onclick="sortAllDaysSpots()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-[11px] font-bold px-2.5 py-1 rounded-full shadow-2xs transition flex items-center gap-1 shrink-0">
                <span>✨</span>
                <span>一鍵自動排序所有天數</span>

      let html = `

            <h2 class="font-bold text-slate-800 text-sm">📅 每日名城巡禮行程與交通排程</h2>

        </div>
                ${dayNavPills}
        
        <!-- 景點分類搜尋速查列 -->
        <div class="mb-4 bg-slate-50 border border-slate-200 rounded-xl p-3 space-y-2.5 shadow-2xs">

              <span class="text-base">🔍</span>
              <span class="text-xs font-black text-slate-800 tracking-wide">景點分類搜尋速查：</span>
              <span class="text-[11px] text-slate-500">選擇分類可立即查看所有排入景點與所在天數</span>
            </div>
            ${itineraryCategoryFilter !== 'all' ? `
              <button onclick="setItineraryCategoryFilter('all')" class="text-[11px] text-slate-500 hover:text-red-600 font-bold flex items-center gap-0.5">
                ✕ 清除分類篩選
              </button>
            ` : ''}
          </div>
          <div class="flex flex-wrap items-center gap-1.5 py-1">
            ${[
              { key: 'all', label: '全部景點' },
              { key: 'shrine', label: '⛩️ 神社' },
              { key: 'castle', label: '🏯 100名城' },
              { key: 'lodging', label: '♨️ 溫泉住宿' },
              { key: 'gourmet', label: '🥩 頂級和牛' },
              { key: 'scenic', label: '🏞️ 經典名勝' },
              { key: 'anime', label: '⚡ 寶可夢/文藝' }
            ].map(cf => {
              const active = itineraryCategoryFilter === cf.key;
              const count = cf.key === 'all' 
                ? assignedIds.size 
                : state.spots.filter(s => getSpotCategory(s) === cf.key && assignedIds.has(s.id)).length;
              const btnClass = active 
                ? 'bg-red-600 text-white font-bold shadow-xs' 
                : 'bg-white text-slate-700 hover:bg-slate-100 border border-slate-200 font-medium';
              return `
                <button onclick="setItineraryCategoryFilter('${cf.key}')" class="text-xs px-3 py-1.5 rounded-full transition flex items-center gap-1.5 cursor-pointer ${btnClass}">

                </button>

          </div>

          ${itineraryCategoryFilter !== 'all' ? renderScheduledCategorySummary(itineraryCategoryFilter) : ''}
        </div>
        ${renderRecommendedSpotsSection()}

    function scrollToDay(dayNumber) {
      const el = document.getElementById(`day-card-${dayNumber}`);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        el.classList.add('ring-4', 'ring-amber-400');
        setTimeout(() => {
          el.classList.remove('ring-4', 'ring-amber-400');
        }, 1500);
      }
      // 同步切換地圖至該天之真實鐵道動線
      const select = document.getElementById("mapFilterSelect");
      if (select && select.value !== String(dayNumber)) {
        select.value = String(dayNumber);
        state.selectedDayFilter = String(dayNumber);
        state._userPanned = false;
        renderMapElements();
      }

    function renderSpotsCardsOnly(cardsContainer) {
      const assignedIds = new Set();
      state.itinerary.forEach(d => (d.spotIds || []).forEach(id => assignedIds.add(id)));

      const search = (spotSearchKeyword || "").trim().toLowerCase();

      const filtered = state.spots.filter(spot => {
        // 1. 分類篩選
        const cat = getSpotCategory(spot);
        if (spotCategoryFilter !== 'all' && cat !== spotCategoryFilter) return false;

        // 2. 排入狀態篩選
        const isScheduled = assignedIds.has(spot.id);
        if (spotScheduledStatusFilter === 'scheduled' && !isScheduled) return false;
        if (spotScheduledStatusFilter === 'unscheduled' && isScheduled) return false;

        // 3. 關鍵字搜尋 (名稱、縣市、筆記、車站、難度)
        if (search) {
          const matchName = (spot.name || "").toLowerCase().includes(search);
          const matchPref = (spot.prefecture || "").toLowerCase().includes(search);
          const matchNotes = (spot.notes || "").toLowerCase().includes(search);
          const matchStation = (spot.nearestStation || "").toLowerCase().includes(search);
          const matchClimb = (spot.climbLevelText || "").toLowerCase().includes(search);
          const matchId = (spot.id || "").toLowerCase().includes(search);
          if (!matchName && !matchPref && !matchNotes && !matchStation && !matchClimb && !matchId) return false;
        }

        return true;
      });

      if (filtered.length === 0) {
        cardsContainer.innerHTML = `
          <div class="p-8 text-center bg-slate-50 rounded-xl border border-dashed border-slate-300 text-slate-500 space-y-2">
            <div class="text-2xl">🔍</div>

        return;

      let html = "";
      filtered.forEach(spot => {
        const cat = getSpotCategory(spot);
        const catBadge = getCategoryBadge(cat);
        const scheduledDays = getSpotScheduledDays(spot.id);
        const isScheduled = scheduledDays.length > 0;

        const closedText = spot.closedDay !== "None" 
          ? `<span class="text-amber-700 font-medium">⚠️ 休館：${escapeHtml(spot.closedDayText || spot.closedDay)}</span>`

              <button onclick="jumpToDayFromSpots(${scheduledDays[0].dayNumber}, '${spot.id}')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-bold px-2 py-0.5 rounded transition shadow-2xs">

    function doTransitSearch(engine) {
      const from = document.getElementById("transitSearchFrom").value.trim();
      const to = document.getElementById("transitSearchTo").value.trim();
      if (!from || !to) {
        alert("請輸入出發站與到達站");
        return;
      }
      if (engine === "yahoo") {
        window.open(`https://transit.yahoo.co.jp/search/result?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`, '_blank');
      } else {
        window.open(`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(from)}&destination=${encodeURIComponent(to)}&travelmode=transit`, '_blank');
      }
    }

      const nextDayNum = state.itinerary.length + 1;
      let nextDate = "";
      if (state.itinerary.length > 0) {
        const lastDate = state.itinerary[state.itinerary.length - 1].date;
        if (lastDate) {
          const d = new Date(lastDate + "T00:00:00");
          d.setDate(d.getDate() + 1);
          nextDate = d.toISOString().split('T')[0];
        }
      }
      state.itinerary.push({
        dayNumber: nextDayNum,
        title: `Day ${nextDayNum}：自訂行程`,
        date: nextDate,
        baseStation: "岡山駅",
        lodging: "",
        notes: "",
        spotIds: []
      });
      saveState();
      renderMainPanel();
      updateMapFilterDropdown();
    }

    function deleteDay(dayNumber) {
      if (!confirm(`確定要刪除 Day ${dayNumber} 的行程嗎？`)) return;
      state.itinerary = state.itinerary.filter(d => d.dayNumber !== dayNumber);
      // 重新編號
      state.itinerary.forEach((d, idx) => {
        d.dayNumber = idx + 1;

      saveState();
      renderMainPanel();
      updateMapFilterDropdown();
      renderMapElements();

      const day = state.itinerary.find(d => d.dayNumber === dayNumber);
      if (!day) return;

      const spotList = state.spots.map(s => `${s.id}: ${s.name} (${s.prefecture || ''})`).join('\n');

      if (!spotId) return;

      const targetSpot = state.spots.find(s => s.id.toLowerCase() === spotId.trim().toLowerCase());
      if (!targetSpot) {
        alert("找不到此 ID 的景點，請輸入清單中正確的 ID！");

      }

      if (!day.spotIds) day.spotIds = [];
      day.spotIds.push(targetSpot.id);
      day.spotIds = sortDaySpotsLodgingAtEnd(day.spotIds);

      renderMainPanel();
      renderMapElements();

    function removeSpotFromDay(dayNumber, index) {
      const day = state.itinerary.find(d => d.dayNumber === dayNumber);
      if (day && day.spotIds) {
        day.spotIds.splice(index, 1);
        saveState();
        renderMainPanel();
        renderMapElements();
      }

    function moveSpotInDay(dayNumber, index, direction) {
      const day = state.itinerary.find(d => d.dayNumber === dayNumber);
      if (!day || !day.spotIds) return;
      const targetIdx = index + direction;
      if (targetIdx < 0 || targetIdx >= day.spotIds.length) return;

      const currentSpot = state.spots.find(s => s.id === day.spotIds[index]);
      const targetSpot = state.spots.find(s => s.id === day.spotIds[targetIdx]);

      // 溫泉住宿規範保護：溫泉景點為夜宿地點，一律排在當天行程最後
      if (isLodgingSpot(currentSpot) && !isLodgingSpot(targetSpot) && direction < 0) {
        alert("溫泉景點為當天夜宿住宿點，一律排在當天行程最後面！");
        return;
      }
      if (!isLodgingSpot(currentSpot) && isLodgingSpot(targetSpot) && direction > 0) {
        alert("日間觀光景點不可移至夜宿溫泉點之後，溫泉住宿一律維持在當天最後！");
        return;
      }

      const temp = day.spotIds[index];
      day.spotIds[index] = day.spotIds[targetIdx];
      day.spotIds[targetIdx] = temp;
      day.spotIds = sortDaySpotsLodgingAtEnd(day.spotIds);
      saveState();
      renderMainPanel();
      renderMapElements();
    }

      const spot = state.spots.find(s => s.id === spotId);

    // ==========================================
    // 智慧地理距離計算與自動排程分析演算法
    // ==========================================
    // 快速大圓距離 (Haversine km)
    function calcHaversineKm(lat1, lon1, lat2, lon2) {
      if (!lat1 || !lon1 || !lat2 || !lon2) return 9999;
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // 評估特定景點在全部天數中的最佳落點 (溫泉住宿一律排在當天最後面)
    function analyzeBestDaysForSpot(spot) {
      if (!spot || !spot.lat || !spot.lng) return [];

      const isCurrentLodging = isLodgingSpot(spot);
      const results = [];

      state.itinerary.forEach(day => {
        const dow = getDayOfWeek(day.date);
        const daySpots = (day.spotIds || [])
          .map(id => state.spots.find(s => s.id === id))
          .filter(s => s && s.lat && s.lng);

        // 1. 檢核休館日衝堂 (溫泉住宿點通常無公休)
        const conflict = checkSpotClosedConflict(spot, day.date);
        const isClosedConflict = !!conflict;

        let minDetour = 9999;
        let bestInsertIndex = 0;
        let closestSpot = null;
        let minDirectDist = 9999;
        let reason = "";
        let insertDesc = "";

        if (daySpots.length === 0) {
          minDetour = 0;
          minDirectDist = 0;
          bestInsertIndex = 0;
          insertDesc = isCurrentLodging ? "♨️ 作為本日夜宿住宿點" : "作為本日第 1 個目標";
          reason = isCurrentLodging ? "本日目前尚無行程，直接作為當日夜宿基地" : "本日目前尚無任何景點排程，可直接作為核心起點";
        } else if (isCurrentLodging) {
          // 【嚴格規則】：溫泉景點是要住宿的，一律排在當天最後面！
          bestInsertIndex = daySpots.length;
          const lastSpot = daySpots[daySpots.length - 1];
          closestSpot = lastSpot;
          minDirectDist = calcHaversineKm(lastSpot.lat, lastSpot.lng, spot.lat, spot.lng);
          minDetour = minDirectDist;

          insertDesc = `♨️ 接續在「${lastSpot.name}」之後 (第 ${bestInsertIndex + 1} 順位，當日夜宿點)`;
          reason = `溫泉住宿一律排在當天最後面！白天行程結束後前往夜宿旅館 (從「${lastSpot.name}」出發車程約 ${Math.round(minDirectDist)} km)`;
        } else {
          // 普通景點 (名城 / 觀光)：不可排在當日既有的溫泉住宿點之後！
          const hasLodgingAtEnd = daySpots.length > 0 && isLodgingSpot(daySpots[daySpots.length - 1]);
          const maxAllowedIndex = hasLodgingAtEnd ? daySpots.length - 1 : daySpots.length;

          // 找出距離此景點最近的當日既有景點
          daySpots.forEach(ds => {
            const d = calcHaversineKm(spot.lat, spot.lng, ds.lat, ds.lng);
            if (d < minDirectDist) {
              minDirectDist = d;
              closestSpot = ds;
            }
          });

          // 位置 0: 插在最前
          const dFirst = calcHaversineKm(spot.lat, spot.lng, daySpots[0].lat, daySpots[0].lng);
          minDetour = dFirst;
          bestInsertIndex = 0;

          // 位置 1 ~ maxAllowedIndex
          for (let i = 0; i < maxAllowedIndex; i++) {
            if (i < daySpots.length - 1) {
              const s1 = daySpots[i];
              const s2 = daySpots[i + 1];
              const origDist = calcHaversineKm(s1.lat, s1.lng, s2.lat, s2.lng);
              const newDist = calcHaversineKm(s1.lat, s1.lng, spot.lat, spot.lng) +
                              calcHaversineKm(spot.lat, spot.lng, s2.lat, s2.lng);
              const detour = newDist - origDist;
              if (detour < minDetour) {
                minDetour = detour;
                bestInsertIndex = i + 1;
              }
            } else if (!hasLodgingAtEnd) {
              // 只有當天末尾不是溫泉住宿時，才允許插在最後
              const dLast = calcHaversineKm(spot.lat, spot.lng, daySpots[daySpots.length - 1].lat, daySpots[daySpots.length - 1].lng);
              if (dLast < minDetour) {
                minDetour = dLast;
                bestInsertIndex = daySpots.length;
              }
            }
          }

          if (bestInsertIndex === 0) {
            insertDesc = `插在「${daySpots[0].name}」之前 (第 1 順位)`;
          } else if (hasLodgingAtEnd && bestInsertIndex === daySpots.length - 1) {
            insertDesc = `插在夜宿點「${daySpots[daySpots.length - 1].name}」之前 (夜宿前最後一站)`;
          } else if (bestInsertIndex >= daySpots.length) {
            insertDesc = `接續在「${daySpots[daySpots.length - 1].name}」之後 (第 ${bestInsertIndex + 1} 順位)`;
          } else {
            insertDesc = `插在「${daySpots[bestInsertIndex - 1].name}」與「${daySpots[bestInsertIndex].name}」之間 (第 ${bestInsertIndex + 1} 順位)`;
          }

          reason = `距離當天「${closestSpot ? closestSpot.name : ''}」最近 (約 ${Math.round(minDirectDist)} km)，預估繞路增加 ${Math.round(minDetour)} km`;
          if (hasLodgingAtEnd) {
            reason += ` (依規範維持溫泉夜宿於本日最後)`;
          }
        }

        if (isClosedConflict) {
          reason += `；⚠️ 但本日為${dow ? dow.zh : ''}，遇公休休館！`;
        } else if (!isCurrentLodging) {
          reason += `；無休館衝突 (當日${dow ? dow.zh : ''}開館)`;
        }

        // 行程負荷懲罰 (當日超過 2 景點以上，山城體力消耗大)
        const loadPenalty = daySpots.length >= 2 ? (daySpots.length - 1) * 20 : 0;
        // 休館日天價懲罰 (避免排入)
        const closedPenalty = isClosedConflict ? 8000 : 0;

        const score = minDetour + loadPenalty + closedPenalty;

        results.push({
          dayNumber: day.dayNumber,
          title: day.title,
          date: day.date,
          dayZh: dow ? dow.zh : "",
          spotCount: daySpots.length,
          isClosedConflict,
          conflictText: conflict ? conflict.closedText : "",
          minDetour: Math.round(minDetour),
          minDirectDist: Math.round(minDirectDist),
          closestSpotName: closestSpot ? closestSpot.name : "",
          bestInsertIndex,
          insertDesc,
          score,
          reason
        });
      });

      // 分數由小到大排序 (分數越低越推薦)
      results.sort((a, b) => a.score - b.score);
      return results;
    }

    // 線上地理編碼 (Nominatim)
    async function autoGeocodeFromName() {
      const name = document.getElementById("modalSpotName").value.trim();
      if (!name) {
        alert("請先在名稱欄位輸入景點名稱！");
        return;
      }

      // 先查快選
      const matched = PRESET_SPOTS.find(p => p.name.includes(name) || name.includes(p.name));
      if (matched) {
        document.getElementById("modalSpotLat").value = matched.lat;
        document.getElementById("modalSpotLng").value = matched.lng;
        if (!document.getElementById("modalSpotPrefecture").value) document.getElementById("modalSpotPrefecture").value = matched.prefecture;
        if (!document.getElementById("modalSpotStation").value) document.getElementById("modalSpotStation").value = matched.nearestStation;
        onModalCoordsOrNameChange();
        return;
      }

      const btn = document.getElementById("btnAutoGeocode");
      const originalText = btn.innerText;
      btn.innerText = "⏳ 查詢中...";
      btn.disabled = true;

      try {
        const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(name + " 日本")}&limit=1`;
        const res = await fetch(url);
        const data = await res.json();
        if (data && data.length > 0) {
          document.getElementById("modalSpotLat").value = parseFloat(data[0].lat).toFixed(4);
          document.getElementById("modalSpotLng").value = parseFloat(data[0].lon).toFixed(4);
          onModalCoordsOrNameChange();
        } else {
          alert("查無此名稱之地理座標，請手動輸入經緯度或選擇上方快選按鈕。");
        }
      } catch (err) {
        alert("線上查詢失敗，請手動輸入經緯度。");
      } finally {
        btn.innerText = originalText;
        btn.disabled = false;
      }
    }

      if (!lat || !lng || !recBox) {

        return;
      }

      const dummySpot = {
        name: name || "此地點",

        lng,

      };

      if (recs.length > 0) {

    // 將景點指派至特定天數與索引位置 (溫泉住宿一律排在末端)
    function assignSpotToDayAndIndex(spotId, dayNumber, insertIndex) {
      const spot = state.spots.find(s => s.id === spotId);
      const targetDay = state.itinerary.find(d => d.dayNumber === dayNumber);
      if (!spot || !targetDay) return;

      // 先從其他天移除避免重複
      state.itinerary.forEach(d => {
        if (d.spotIds) {
          d.spotIds = d.spotIds.filter(id => id !== spotId);
        }
      });

      if (!targetDay.spotIds) targetDay.spotIds = [];

      if (isLodgingSpot(spot)) {
        // 溫泉住宿點一律加在最後
        targetDay.spotIds.push(spotId);
      } else {
        if (insertIndex >= targetDay.spotIds.length) {
          targetDay.spotIds.push(spotId);
        } else {
          targetDay.spotIds.splice(insertIndex, 0, spotId);
        }
      }

      // 強制確保溫泉住宿排在當天最後面
      targetDay.spotIds = sortDaySpotsLodgingAtEnd(targetDay.spotIds);

      saveState();
      closeSmartPlanModal();
      switchTab('itinerary');
      renderMainPanel();
      renderMapElements();
      const extraMsg = isLodgingSpot(spot) ? " (已依溫泉住宿規範排在本日最後一站)" : "";
      alert(`已成功將「${spot.name}」排入 Day ${dayNumber}！${extraMsg}`);
    }

    // 一鍵將所有尚未排程的景點全自動指派至最佳天數 (溫泉住宿強制排在末端)
    function autoAssignAllUnassigned() {
      const assignedIds = new Set();
      state.itinerary.forEach(d => (d.spotIds || []).forEach(id => assignedIds.add(id)));
      const unassigned = state.spots.filter(s => !assignedIds.has(s.id));

      if (unassigned.length === 0) {
        alert("所有景點均已排入行程！");
        return;
      }

      let count = 0;
      unassigned.forEach(sp => {
        const recs = analyzeBestDaysForSpot(sp);
        if (recs.length > 0) {
          const best = recs[0];
          const day = state.itinerary.find(d => d.dayNumber === best.dayNumber);
          if (day) {
            if (!day.spotIds) day.spotIds = [];
            if (isLodgingSpot(sp) || best.bestInsertIndex >= day.spotIds.length) {
              day.spotIds.push(sp.id);
            } else {
              day.spotIds.splice(best.bestInsertIndex, 0, sp.id);
            }
            day.spotIds = sortDaySpotsLodgingAtEnd(day.spotIds);
            count++;
          }
        }
      });

      saveState();
      renderMainPanel();
      renderMapElements();
      alert(`已成功將 ${count} 個未排景點自動規劃安排至最順路的天數！(溫泉住宿點均已固定於各日最末端)`);
    }
